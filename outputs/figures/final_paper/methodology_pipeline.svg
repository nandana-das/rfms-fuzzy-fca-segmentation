<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#ffffff"/>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #17212b; }
    .subtitle { font: 20px Arial, sans-serif; fill: #4b5563; }
    .box { fill: #f7fafc; stroke: #34495e; stroke-width: 2; rx: 16; }
    .accent { fill: #eaf4f4; stroke: #147d86; stroke-width: 2; rx: 16; }
    .text { font: 22px Arial, sans-serif; fill: #17212b; text-anchor: middle; }
    .small { font: 18px Arial, sans-serif; fill: #374151; text-anchor: middle; }
    .arrow { stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#52606d"/>
    </marker>
  </defs>
  <text x="800" y="58" class="title" text-anchor="middle">Frozen RFM-FCA evaluation methodology</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">Leakage-aware rolling-origin evaluation on Dunnhumby and Online Retail II</text>

  <rect x="70" y="160" width="260" height="125" class="box"/>
  <text x="200" y="207" class="text">Transaction data</text>
  <text x="200" y="242" class="small">cleaning and positive-price filter</text>

  <rect x="430" y="160" width="260" height="125" class="box"/>
  <text x="560" y="207" class="text">Rolling origins</text>
  <text x="560" y="242" class="small">91-day horizon; train-only fitting</text>

  <rect x="790" y="160" width="260" height="125" class="box"/>
  <text x="920" y="207" class="text">Customer RFM</text>
  <text x="920" y="242" class="small">recency, frequency, monetary value</text>

  <rect x="1150" y="145" width="330" height="155" class="accent"/>
  <text x="1315" y="192" class="text">Formal contexts</text>
  <text x="1315" y="228" class="small">crisp bands versus fuzzy</text>
  <text x="1315" y="258" class="small">membership levels and α-cuts</text>

  <path d="M330 222 L430 222" class="arrow"/>
  <path d="M690 222 L790 222" class="arrow"/>
  <path d="M1050 222 L1150 222" class="arrow"/>

  <rect x="300" y="405" width="300" height="125" class="accent"/>
  <text x="450" y="452" class="text">FCA concept mining</text>
  <text x="450" y="487" class="small">support threshold and closure</text>

  <rect x="650" y="405" width="300" height="125" class="accent"/>
  <text x="800" y="452" class="text">Redundancy suppression</text>
  <text x="800" y="487" class="small">extent-Jaccard filtering</text>

  <rect x="1000" y="405" width="300" height="125" class="box"/>
  <text x="1150" y="452" class="text">Downstream models</text>
  <text x="1150" y="487" class="small">classification and regression</text>

  <path d="M1315 300 L1315 355 L450 355 L450 405" class="arrow"/>
  <path d="M600 467 L650 467" class="arrow"/>
  <path d="M950 467 L1000 467" class="arrow"/>

  <rect x="410" y="620" width="300" height="78" class="box"/>
  <text x="560" y="667" class="text">Predictive metrics</text>
  <rect x="900" y="620" width="300" height="78" class="box"/>
  <text x="1050" y="667" class="text">Segment stability</text>
  <path d="M1150 530 L1150 580 L560 580 L560 620" class="arrow"/>
  <path d="M1150 530 L1150 620" class="arrow"/>
  <text x="800" y="735" class="subtitle" text-anchor="middle">All transformations, concepts, and models are fit within each training fold.</text>
</svg>
